# CF-Connecting-IP is set by Cloudflare and cannot be forged by the client.
# Fall back to the socket address for direct-to-origin requests.
map $http_cf_connecting_ip $real_client_ip {
    default   $http_cf_connecting_ip;
    ""        $remote_addr;
}

# ACME challenge + API over plain HTTP (Cloudflare edge redirects to HTTPS)
server {
    listen 80;
    server_name api.visiontech.al;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name api.visiontech.al;

    ssl_certificate     /etc/letsencrypt/live/api.visiontech.al/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.visiontech.al/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
